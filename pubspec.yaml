name: hr_employee_app
description: Employee self-service app for the HR Attendance System.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icon/mytm_icon_square.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/mytm_icon_square.png"
  web:
    generate: true
    image_path: "assets/icon/mytm_icon_square.png"
    background_color: "#FFFFFF"
    theme_color: "#EC1B21"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
